<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">VoiceOps retrieval-augmented generation pipeline</title><desc id="desc">Knowledge documents are chunked with section metadata, indexed, searched, ranked and passed to Gemini for a grounded response with source tracking.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111a29"/><stop offset="1" stop-color="#242b43"/></linearGradient><linearGradient id="line" x2="1"><stop stop-color="#f2a273"/><stop offset=".48" stop-color="#8978ff"/><stop offset="1" stop-color="#5fd0d7"/></linearGradient></defs>
  <rect width="1200" height="470" rx="28" fill="url(#bg)"/><text x="48" y="55" fill="#aab5c8" font-family="Segoe UI,Arial" font-size="14" font-weight="700" letter-spacing="2.4">GROUNDED ANSWERS · RAG</text><text x="48" y="98" fill="#f5f6fa" font-family="Segoe UI,Arial" font-size="29" font-weight="700">Retrieve evidence first. Answer from the retrieved context.</text>
  <g font-family="Segoe UI,Arial"><g><rect x="48" y="160" width="220" height="176" rx="18" fill="#202b40" stroke="#45516a"/><text x="72" y="198" fill="#f1a77e" font-size="13" font-weight="700" letter-spacing="1.2">01 · SOURCE</text><text x="72" y="236" fill="#fff" font-size="20" font-weight="700">21 Markdown docs</text><text x="72" y="270" fill="#cbd3e1" font-size="15">Policy · guide · help</text><text x="72" y="296" fill="#cbd3e1" font-size="15">FAQ · catalog</text><text x="72" y="322" fill="#8f9db4" font-size="13">Logs are context only</text></g>
  <g><rect x="342" y="160" width="220" height="176" rx="18" fill="#202b40" stroke="#45516a"/><text x="366" y="198" fill="#b4aaff" font-size="13" font-weight="700" letter-spacing="1.2">02 · CHUNK + INDEX</text><text x="366" y="236" fill="#fff" font-size="17" font-weight="700">Section-aware chunks</text><text x="366" y="270" fill="#cbd3e1" font-size="15">ID · status · effective date</text><text x="366" y="296" fill="#cbd3e1" font-size="15">Embeddings if configured</text><text x="366" y="322" fill="#8f9db4" font-size="13">Lexical retrieval fallback</text></g>
  <g><rect x="636" y="160" width="220" height="176" rx="18" fill="#202b40" stroke="#45516a"/><text x="660" y="198" fill="#86dce0" font-size="13" font-weight="700" letter-spacing="1.2">03 · QUERY</text><text x="660" y="236" fill="#fff" font-size="18" font-weight="700">Rank relevant context</text><text x="660" y="270" fill="#cbd3e1" font-size="15">Current policy takes priority</text><text x="660" y="296" fill="#cbd3e1" font-size="15">Down-rank superseded policy</text><text x="660" y="322" fill="#8f9db4" font-size="13">Keep source IDs attached</text></g>
  <g><rect x="930" y="160" width="220" height="176" rx="18" fill="#202b40" stroke="#45516a"/><text x="954" y="198" fill="#86dce0" font-size="13" font-weight="700" letter-spacing="1.2">04 · RESPOND</text><text x="954" y="236" fill="#fff" font-size="20" font-weight="700">Gemini + evidence</text><text x="954" y="270" fill="#cbd3e1" font-size="15">Use facts in context</text><text x="954" y="296" fill="#cbd3e1" font-size="15">Say when facts are missing</text><text x="954" y="322" fill="#8f9db4" font-size="13">Return retrieved source IDs</text></g></g>
  <g fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round"><path d="M268 248h74"/><path d="M562 248h74"/><path d="M856 248h74"/></g><g fill="#aab5c8" font-family="Segoe UI,Arial" font-size="14"><text x="285" y="231">parse</text><text x="575" y="231">retrieve</text><text x="872" y="231">ground</text></g>
  <text x="48" y="402" fill="#8f9db4" font-family="Segoe UI,Arial" font-size="14">Vector path: configured OpenAI-compatible embeddings + in-memory cosine index · fallback: offline lexical ranking</text>
</svg>
