<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">VoiceOps speech processing flow</title><desc id="desc">Customer audio goes through Gnani speech-to-text, the shared Step 3 agent and Gnani text-to-speech to produce a playable reply.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f9f4ee"/><stop offset="1" stop-color="#f1effb"/></linearGradient><linearGradient id="flow" x2="1"><stop stop-color="#f1a075"/><stop offset=".5" stop-color="#8d7cff"/><stop offset="1" stop-color="#55cbd4"/></linearGradient></defs>
  <rect width="1200" height="390" rx="28" fill="url(#bg)"/><text x="48" y="56" fill="#68748a" font-family="Segoe UI,Arial" font-size="14" font-weight="700" letter-spacing="2.4">STEP 4 · VOICE TURN</text><text x="48" y="99" fill="#202a39" font-family="Segoe UI,Arial" font-size="29" font-weight="700">Speech is an I/O layer around the same conversational brain</text>
  <path d="M145 214H1050" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/><g font-family="Segoe UI,Arial" text-anchor="middle">
    <g><circle cx="145" cy="214" r="44" fill="#fff" stroke="#e6ded7"/><text x="145" y="209" fill="#293449" font-size="16" font-weight="700">Caller</text><text x="145" y="232" fill="#6c778a" font-size="13">audio</text></g>
    <g><circle cx="386" cy="214" r="44" fill="#fff" stroke="#dcd5f2"/><text x="386" y="209" fill="#6555c9" font-size="16" font-weight="700">Gnani</text><text x="386" y="232" fill="#6c778a" font-size="13">STT</text></g>
    <g><rect x="517" y="158" width="190" height="112" rx="23" fill="#273247"/><text x="612" y="201" fill="#fff" font-size="19" font-weight="700">SupportAgent</text><text x="612" y="228" fill="#cbd4e3" font-size="14">memory · RAG · tools</text><text x="612" y="250" fill="#8f9db4" font-size="12">Gemini-backed</text></g>
    <g><circle cx="838" cy="214" r="44" fill="#fff" stroke="#d5e4e5"/><text x="838" y="209" fill="#347f89" font-size="16" font-weight="700">Gnani</text><text x="838" y="232" fill="#6c778a" font-size="13">TTS</text></g>
    <g><circle cx="1050" cy="214" r="44" fill="#fff" stroke="#e6ded7"/><text x="1050" y="209" fill="#293449" font-size="16" font-weight="700">Reply</text><text x="1050" y="232" fill="#6c778a" font-size="13">playable WAV</text></g>
  </g><g fill="#657187" font-family="Segoe UI,Arial" font-size="13" text-anchor="middle"><text x="265" y="198">record / upload</text><text x="470" y="198">transcript</text><text x="768" y="198">short text</text><text x="945" y="198">speech</text></g>
  <text x="48" y="335" fill="#697589" font-family="Segoe UI,Arial" font-size="14">Unclear transcript → retry prompt · over-60-second batch clip → recorded validation error · no alternate speech provider</text>
</svg>
