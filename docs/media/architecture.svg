<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">VoiceOps system architecture</title><desc id="desc">CLI and browser share the Python SupportAgent and connect to Gemini, retrieval, mock order tools, and Gnani speech services.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1a2540"/></linearGradient><linearGradient id="a" x2="1"><stop stop-color="#8b7cff"/><stop offset="1" stop-color="#5ac7d8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#050a14" flood-opacity=".32"/></filter></defs>
  <rect width="1200" height="590" rx="30" fill="url(#bg)"/><text x="52" y="60" fill="#9eacc3" font-family="Segoe UI,Arial" font-size="15" font-weight="700" letter-spacing="3">VOICEOPS 2026 · SYSTEM MAP</text><text x="52" y="105" fill="#f4f6fb" font-family="Segoe UI,Arial" font-size="31" font-weight="700">One agent, three entry points, shared capabilities</text>
  <g font-family="Segoe UI,Arial" filter="url(#shadow)">
    <rect x="48" y="174" width="230" height="118" rx="18" fill="#202c40" stroke="#35435b"/><text x="72" y="210" fill="#a7b4cb" font-size="13" font-weight="700" letter-spacing="1.5">INTERFACES</text><text x="72" y="247" fill="#f7f8fb" font-size="20" font-weight="700">CLI · PowerShell</text><text x="72" y="276" fill="#d4dbea" font-size="16">Local / hosted web</text>
    <rect x="48" y="365" width="230" height="118" rx="18" fill="#202c40" stroke="#35435b"/><text x="72" y="401" fill="#a7b4cb" font-size="13" font-weight="700" letter-spacing="1.5">VOICE INPUT / OUTPUT</text><text x="72" y="438" fill="#f7f8fb" font-size="20" font-weight="700">Customer audio</text><text x="72" y="467" fill="#d4dbea" font-size="16">Gnani STT · Gnani TTS</text>
    <rect x="382" y="252" width="300" height="148" rx="22" fill="#29364c" stroke="url(#a)" stroke-width="2"/><text x="412" y="293" fill="#8ee0e3" font-size="13" font-weight="700" letter-spacing="1.5">SHARED PYTHON CORE</text><text x="412" y="337" fill="#fff" font-size="25" font-weight="700">SupportAgent</text><text x="412" y="371" fill="#d4dbea" font-size="16">Memory · policy · tools · response</text>
    <rect x="786" y="145" width="352" height="105" rx="18" fill="#202c40" stroke="#59637b"/><text x="816" y="183" fill="#a7b4cb" font-size="13" font-weight="700" letter-spacing="1.5">LANGUAGE MODEL</text><text x="816" y="220" fill="#f7f8fb" font-size="22" font-weight="700">Google Gemini API</text>
    <rect x="786" y="274" width="352" height="105" rx="18" fill="#202c40" stroke="#59637b"/><text x="816" y="312" fill="#a7b4cb" font-size="13" font-weight="700" letter-spacing="1.5">KNOWLEDGE RETRIEVAL</text><text x="816" y="349" fill="#f7f8fb" font-size="18" font-weight="700">Markdown · embeddings / lexical</text>
    <rect x="786" y="403" width="352" height="105" rx="18" fill="#202c40" stroke="#59637b"/><text x="816" y="441" fill="#a7b4cb" font-size="13" font-weight="700" letter-spacing="1.5">SYNTHETIC SUPPORT TOOLS</text><text x="816" y="478" fill="#f7f8fb" font-size="22" font-weight="700">lookup_order · create_ticket</text>
  </g>
  <g fill="none" stroke="url(#a)" stroke-width="3" stroke-linecap="round"><path d="M278 232H382"/><path d="M278 424H330Q356 424 356 398V378Q356 358 382 358"/><path d="M682 291H730Q752 291 752 212V197H786"/><path d="M682 326H786"/><path d="M682 360H730Q752 360 752 455V456H786"/></g>
  <g fill="#b9c4d7" font-family="Segoe UI,Arial" font-size="14"><text x="310" y="220">text turns</text><text x="305" y="416">speech turn</text><text x="703" y="182">generate</text><text x="704" y="315">retrieve</text><text x="705" y="449">verified action</text></g>
  <text x="52" y="548" fill="#8392ab" font-family="Segoe UI,Arial" font-size="14">Retrieval, business rules and tool execution stay in the existing Python application layer.</text>
