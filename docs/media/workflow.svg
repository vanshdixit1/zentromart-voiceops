<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">VoiceOps capstone workflow</title><desc id="desc">Step 1 prompt, Step 2 documents and RAG, Step 3 conversation and tools, Step 4 Gnani voice.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8f4ef"/><stop offset="1" stop-color="#f1eefb"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#f29c71"/><stop offset=".55" stop-color="#8b7cff"/><stop offset="1" stop-color="#54c8d8"/></linearGradient></defs>
  <rect width="1200" height="410" rx="28" fill="url(#bg)"/><text x="48" y="53" fill="#68748a" font-family="Segoe UI,Arial" font-size="14" font-weight="700" letter-spacing="2.4">CAPSTONE BUILD PATH</text><text x="48" y="94" fill="#202a39" font-family="Segoe UI,Arial" font-size="29" font-weight="700">Each step adds capability to the same support agent</text>
  <path d="M155 214H1045" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/><g font-family="Segoe UI,Arial">
    <g><circle cx="155" cy="214" r="24" fill="#273248"/><text x="147" y="221" fill="#fff" font-size="20" font-weight="700">1</text><rect x="56" y="258" width="198" height="98" rx="18" fill="#fff" stroke="#e3dfda"/><text x="76" y="292" fill="#293449" font-size="18" font-weight="700">Prompting</text><text x="76" y="322" fill="#657187" font-size="15">Role · constraints</text><text x="76" y="343" fill="#657187" font-size="15">First LLM answer</text></g>
    <g><circle cx="452" cy="214" r="24" fill="#6658cf"/><text x="444" y="221" fill="#fff" font-size="20" font-weight="700">2</text><rect x="353" y="258" width="198" height="98" rx="18" fill="#fff" stroke="#dcd6fa"/><text x="373" y="292" fill="#293449" font-size="18" font-weight="700">Documents</text><text x="373" y="322" fill="#657187" font-size="15">RAG · source IDs</text><text x="373" y="343" fill="#657187" font-size="15">Grounded answers</text></g>
    <g><circle cx="749" cy="214" r="24" fill="#4b739d"/><text x="741" y="221" fill="#fff" font-size="20" font-weight="700">3</text><rect x="650" y="258" width="198" height="98" rx="18" fill="#fff" stroke="#d6e1eb"/><text x="670" y="292" fill="#293449" font-size="18" font-weight="700">Conversation</text><text x="670" y="322" fill="#657187" font-size="15">Memory · verification</text><text x="670" y="343" fill="#657187" font-size="15">Lookup · ticket · handoff</text></g>
    <g><circle cx="1045" cy="214" r="24" fill="#242e40"/><text x="1037" y="221" fill="#fff" font-size="20" font-weight="700">4</text><rect x="946" y="258" width="198" height="98" rx="18" fill="#fff" stroke="#d5dcdf"/><text x="966" y="292" fill="#293449" font-size="18" font-weight="700">Voice</text><text x="966" y="322" fill="#657187" font-size="15">Gnani STT → agent</text><text x="966" y="343" fill="#657187" font-size="15">Gnani TTS → caller</text></g>
  </g><text x="48" y="386" fill="#7b8494" font-family="Segoe UI,Arial" font-size="14">The CLI, local browser and hosted browser reuse the same application logic.</text>
</svg>
